[package]
name = "controller"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres"] }
tokio = { version = "1.47.1", features = ["full"] }
dotenvy = "0.15"
axum = "0.8.4"
serde = { version = "1.0", features = ["derive", "json"] }