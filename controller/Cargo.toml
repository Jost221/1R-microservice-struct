[package]
name = "controller"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres"] }
redis = { version = "0.32.5", features = ["tokio-comp", "connection-manager"] }
tokio = { version = "1.47.1", features = ["full"] }
redis-derive = "0.1.7"
dotenvy = "0.15"
axum = "0.8.4"
serde = { version = "1.0.221", features = ["derive"] }